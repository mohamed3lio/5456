<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة مشروع الصيانة التنبؤية | Pro V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Cairo', 'sans-serif'], display: ['Tajawal', 'sans-serif'] },
                    colors: { primary: '#1e40af', leader: '#7e22ce', hw: '#2563eb', ai: '#ea580c', sw: '#16a34a' }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); }
        .dark .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255,255,255,0.1); }
        
        .kanban-col { min-height: 70vh; transition: background 0.3s; }
        .kanban-col.drag-over { background: rgba(59, 130, 246, 0.1); border: 2px dashed #3b82f6; border-radius: 1rem; }
        
        .task-card { cursor: grab; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border-right-width: 4px; }
        .task-card:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .task-card:active { cursor: grabbing; transform: scale(0.95); }
        .dragging { opacity: 0.5; transform: scale(1.05); z-index: 50; }
        
        /* Team Accents */
        .border-leader { border-right-color: #9333ea; } .border-hw { border-right-color: #3b82f6; }
        .border-ai { border-right-color: #f97316; } .border-sw { border-right-color: #22c55e; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Toast Animation */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 antialiased h-screen overflow-hidden flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="glass-panel sticky top-0 z-40 w-full shadow-sm">
        <div class="max-w-screen-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-industry text-xl"></i></div>
                <div>
                    <h1 class="text-xl font-display font-bold">Predictive Maintenance (PdM)</h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400">Team Dashboard V2.0 | Titan Cement Project</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Search Bar -->
                <div class="relative hidden md:block">
                    <i class="fa-solid fa-search absolute right-3 top-2.5 text-gray-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="ابحث عن مهمة..." onkeyup="searchTasks()" class="pl-4 pr-9 py-2 rounded-full border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 transition-all">
                </div>
                
                <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-600 transition">
                    <i id="themeIcon" class="fa-solid fa-moon text-gray-600 dark:text-gray-300"></i>
                </button>
                <button onclick="openAddTaskModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-full text-sm font-bold shadow-lg shadow-blue-500/30 transition transform hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> مهمة جديدة
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content & Stats -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6 pb-20">
        <div class="max-w-screen-2xl mx-auto">
            
            <!-- Statistics Cards -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                <!-- Overall Progress -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col justify-center relative overflow-hidden group">
                    <div class="absolute right-0 top-0 w-1 h-full bg-blue-500"></div>
                    <span class="text-gray-500 dark:text-gray-400 text-xs font-bold mb-1">إنجاز المشروع</span>
                    <div class="flex items-end justify-between">
                        <span id="stat-total" class="text-3xl font-display font-bold text-gray-800 dark:text-white">0%</span>
                        <i class="fa-solid fa-rocket text-blue-100 dark:text-blue-900/30 text-4xl absolute left-2 bottom-2 transform group-hover:scale-110 transition"></i>
                    </div>
                </div>
                <!-- Leader -->
                <div class="glass-panel p-4 rounded-2xl border-b-4 border-leader">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1"><i class="fa-solid fa-user-tie text-leader"></i> القيادة</span>
                    <span id="stat-ld" class="text-2xl font-bold mt-1 block">0/0</span>
                </div>
                <!-- Hardware -->
                <div class="glass-panel p-4 rounded-2xl border-b-4 border-hw">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1"><i class="fa-solid fa-microchip text-hw"></i> الهاردوير</span>
                    <span id="stat-hw" class="text-2xl font-bold mt-1 block">0/0</span>
                </div>
                <!-- AI -->
                <div class="glass-panel p-4 rounded-2xl border-b-4 border-ai">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1"><i class="fa-solid fa-brain text-ai"></i> الذكاء الاصطناعي</span>
                    <span id="stat-ai" class="text-2xl font-bold mt-1 block">0/0</span>
                </div>
                <!-- Software -->
                <div class="glass-panel p-4 rounded-2xl border-b-4 border-sw">
                    <span class="text-xs font-bold text-gray-500 dark:text-gray-400 flex items-center gap-1"><i class="fa-solid fa-laptop-code text-sw"></i> البرمجيات</span>
                    <span id="stat-sw" class="text-2xl font-bold mt-1 block">0/0</span>
                </div>
            </div>

            <!-- Kanban Board -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- Column: To Do -->
                <div class="flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg text-gray-700 dark:text-gray-200 flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-gray-400"></span> قائمة المهام <span class="text-xs font-normal text-gray-500" id="count-todo">(0)</span>
                        </h2>
                    </div>
                    <div class="kanban-col space-y-3 pb-10" id="todo"></div>
                </div>

                <!-- Column: In Progress -->
                <div class="flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg text-blue-600 dark:text-blue-400 flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span> جاري التنفيذ <span class="text-xs font-normal text-gray-500" id="count-progress">(0)</span>
                        </h2>
                    </div>
                    <div class="kanban-col space-y-3 pb-10" id="progress"></div>
                </div>

                <!-- Column: Done -->
                <div class="flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="font-bold text-lg text-green-600 dark:text-green-400 flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-green-500"></span> مكتملة <span class="text-xs font-normal text-gray-500" id="count-done">(0)</span>
                        </h2>
                    </div>
                    <div class="kanban-col space-y-3 pb-10" id="done"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Task Details Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden transform transition-all">
            <div id="modalHeader" class="px-6 py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center">
                <span id="modalTeamBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-gray-100 text-gray-800"></span>
                <button onclick="closeModal('taskModal')" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <h3 id="modalTitle" class="text-xl font-bold mb-4 dark:text-white"></h3>
                <p id="modalDesc" class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed mb-6 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg border border-gray-100 dark:border-gray-600"></p>
                <div class="flex justify-between items-center text-sm font-semibold">
                    <div class="flex items-center gap-2 text-gray-500 dark:text-gray-400">
                        <i class="fa-regular fa-calendar"></i>
                        <span id="modalDate"></span>
                    </div>
                    <span id="modalPriority" class="px-3 py-1 rounded-md text-xs"></span>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-700/30 border-t border-gray-100 dark:border-gray-700 flex justify-between">
                 <button id="deleteTaskBtn" class="text-red-500 hover:text-red-700 text-sm font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> حذف المهمة
                </button>
                <button onclick="closeModal('taskModal')" class="bg-gray-800 text-white px-5 py-2 rounded-lg text-sm font-bold hover:bg-gray-900 transition">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div id="addTaskModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md shadow-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold dark:text-white">إضافة مهمة جديدة</h3>
                <button onclick="closeModal('addTaskModal')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">عنوان المهمة</label>
                    <input type="text" id="newTaskTitle" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">تفاصيل المهمة (شرح فني)</label>
                    <textarea id="newTaskDesc" rows="3" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">الفريق</label>
                        <select id="newTaskTeam" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                            <option value="leader">القيادة</option>
                            <option value="hw">الهاردوير</option>
                            <option value="ai">الذكاء الاصطناعي</option>
                            <option value="sw">البرمجيات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-1">الأولوية</label>
                        <select id="newTaskPriority" class="w-full p-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none">
                            <option value="high">عالية (أحمر)</option>
                            <option value="med">متوسطة (أصفر)</option>
                            <option value="low">عادية (أزرق)</option>
                        </select>
                    </div>
                </div>
                <button onclick="addNewTask()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg mt-4 hover:bg-blue-700 transition">حفظ المهمة</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 left-5 z-50 flex flex-col gap-2"></div>

    <script>
        // Data Structure - Detailed Engineering Tasks
        const defaultTasks = [
            // Leader Tasks
            { id: "t1", title: "زيارة مصنع تيتان للأسمنت", desc: "مقابلة مهندس الصيانة، وتسليم الخطاب الرسمي، ومعاينة مروحة السحب (ID Fan) أو المضخات وتحديد مكان تركيب الحساسات.", team: "leader", col: "todo", priority: "high", date: "الأسبوع 1" },
            { id: "t2", title: "تنسيق شراء المكونات والميزانية", desc: "تجميع مبالغ الميزانية من الفريق (500 ج للفرد) وشراء مكونات النموذج الأولي (ESP32, MPU6050, MLX90614).", team: "leader", col: "todo", priority: "high", date: "الأسبوع 1" },
            { id: "t13", title: "اختبار التكامل الشامل (Integration Test)", desc: "تجربة النظام بالكامل: قراءة الاهتزاز -> معالجته بالنموذج المدمج -> إرساله للسيرفر -> عرضه على الجرافانا.", team: "leader", col: "todo", priority: "high", date: "الأسبوع 10" },
            { id: "t14", title: "كتابة تقرير التخرج (Thesis)", desc: "تجميع الملفات والمخططات من كافة الفرق وتنسيق كتاب التخرج والعرض التقديمي للمناقشة.", team: "leader", col: "todo", priority: "med", date: "الأسبوع 14" },
            
            // Hardware Tasks
            { id: "t3", title: "توصيل الحساسات على Breadboard", desc: "لحام وتوصيل حساس MPU6050 وحساس الحرارة مع الـ ESP32 والتأكد من التوصيل الكهربي الصحيح (I2C).", team: "hw", col: "todo", priority: "high", date: "الأسبوع 2" },
            { id: "t4", title: "برمجة المتحكم لجمع البيانات", desc: "كتابة كود C++ لضبط معدل العينات (Sampling Rate) ليكون سريعاً كفاية لالتقاط الترددات العالية بدون ضياع بيانات.", team: "hw", col: "todo", priority: "high", date: "الأسبوع 3" },
            { id: "t5", title: "تصميم الدائرة المطبوعة (Custom PCB)", desc: "تصميم الـ Schematic والـ Layout على برنامج مثل KiCad أو EasyEDA وإرساله للطباعة.", team: "hw", col: "todo", priority: "med", date: "الأسبوع 6" },
            { id: "t6", title: "تصميم وطباعة الغلاف الميكانيكي (3D Enclosure)", desc: "تصميم غلاف يحمي اللوحة من تراب الأسمنت وحرارة المصنع، وتجهيز قاعدة مغناطيسية لتثبيت الحساس بقوة على الماكينة.", team: "hw", col: "todo", priority: "med", date: "الأسبوع 8" },

            // AI Tasks
            { id: "t7", title: "استخراج الخصائص وإشارة الاهتزاز", desc: "استخدام MATLAB أو Python لمحاكاة إشارة اهتزاز، وتطبيق تحويل فورير السريع (FFT) لاستخراج الترددات.", team: "ai", col: "todo", priority: "high", date: "الأسبوع 4" },
            { id: "t8", title: "تدريب نموذج الذكاء الاصطناعي", desc: "بناء نموذج Anomaly Detection (مثل Isolation Forest) وتدريبه على قراءات الماكينة الطبيعية لاكتشاف الشذوذ.", team: "ai", col: "todo", priority: "high", date: "الأسبوع 6" },
            { id: "t9", title: "تطبيق TinyML باستخدام Edge Impulse", desc: "ضغط نموذج الذكاء الاصطناعي وتحويله إلى مكتبة C++ لتعمل مباشرة على الـ ESP32 دون الحاجة لإنترنت سريع.", team: "ai", col: "todo", priority: "high", date: "الأسبوع 9" },

            // Software Tasks
            { id: "t10", title: "إعداد سيرفر MQTT وقاعدة البيانات", desc: "حجز سيرفر وإعداد MQTT Broker لاستقبال البيانات، وربطه بقاعدة بيانات InfluxDB المخصصة للـ Time-Series.", team: "sw", col: "todo", priority: "high", date: "الأسبوع 5" },
            { id: "t11", title: "تصميم لوحة التحكم (Grafana Dashboard)", desc: "إنشاء حساب على Grafana Cloud (سيرفر فرانكفورت) وتصميم رسوم بيانية حية لعرض الحرارة، الاهتزاز، وصحة الماكينة.", team: "sw", col: "todo", priority: "high", date: "الأسبوع 7" },
            { id: "t12", title: "نظام التنبيهات الفورية (Telegram Alerts)", desc: "برمجة بوت تليجرام أو نظام إشعارات يرسل رسالة تحذيرية لمهندس الصيانة عند تجاوز الاهتزاز للحد المسموح.", team: "sw", col: "todo", priority: "med", date: "الأسبوع 11" }
        ];

        // Team Config
        const teamsInfo = {
            "leader": { name: "القيادة (Team Leader)", color: "bg-purple-100 text-purple-700", border: "border-leader" },
            "hw": { name: "الهاردوير (4)", color: "bg-blue-100 text-blue-700", border: "border-hw" },
            "ai": { name: "الذكاء الاصطناعي (3)", color: "bg-orange-100 text-orange-700", border: "border-ai" },
            "sw": { name: "البرمجيات (2)", color: "bg-green-100 text-green-700", border: "border-sw" }
        };

        const priorityConfig = {
            "high": { text: "أولوية عالية", style: "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400" },
            "med": { text: "أولوية متوسطة", style: "bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-400" },
            "low": { text: "عادية", style: "bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300" }
        };

        // App State
        let tasks = JSON.parse(localStorage.getItem('pdm_pro_tasks'));
        if (!tasks || tasks.length === 0) tasks = [...defaultTasks];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
            renderBoard();
            setupDragAndDrop();
        });

        // Toggle Dark Mode
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun text-yellow-400' : 'fa-solid fa-moon text-gray-600';
        }

        // Render Kanban & Stats
        function renderBoard(searchQuery = "") {
            const cols = { todo: document.getElementById('todo'), progress: document.getElementById('progress'), done: document.getElementById('done') };
            Object.values(cols).forEach(col => col.innerHTML = '');
            
            let stats = { 
                cols: { todo: 0, progress: 0, done: 0 }, 
                teams: { leader: {t:0, d:0}, hw: {t:0, d:0}, ai: {t:0, d:0}, sw: {t:0, d:0} } 
            };

            tasks.forEach(task => {
                // Update Stats (independent of search)
                stats.cols[task.col]++;
                stats.teams[task.team].t++;
                if (task.col === 'done') stats.teams[task.team].d++;

                // Search Filter
                if (searchQuery && !task.title.includes(searchQuery) && !task.desc.includes(searchQuery)) return;

                // Create Card element
                const el = document.createElement('div');
                const tInfo = teamsInfo[task.team];
                
                el.className = `task-card bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 ${tInfo.border} relative overflow-hidden group`;
                el.draggable = true;
                el.id = task.id;
                el.onclick = (e) => { if(e.target.tagName !== 'I') openTaskDetails(task.id); }; // Prevent modal on drag click
                
                // Opacity for done
                if(task.col === 'done') el.classList.add('opacity-70');

                el.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold px-2 py-1 rounded-md ${tInfo.color} dark:bg-opacity-20">${tInfo.name}</span>
                        ${task.priority === 'high' ? '<i class="fa-solid fa-fire text-red-500 text-xs"></i>' : ''}
                    </div>
                    <h4 class="font-bold text-sm text-gray-800 dark:text-gray-100 leading-tight mb-2 ${task.col === 'done' ? 'line-through text-gray-500' : ''}">${task.title}</h4>
                    <div class="flex justify-between items-center text-[10px] text-gray-400 font-semibold border-t border-gray-50 dark:border-gray-700 pt-2 mt-2">
                        <span><i class="fa-regular fa-clock mr-1"></i> ${task.date}</span>
                        <i class="fa-solid fa-grip-lines text-gray-300 dark:text-gray-600 group-hover:text-blue-500 transition cursor-grab"></i>
                    </div>
                `;

                // Drag Events
                el.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', task.id);
                    setTimeout(() => el.classList.add('dragging'), 0);
                });
                el.addEventListener('dragend', () => el.classList.remove('dragging'));

                cols[task.col].appendChild(el);
            });

            // Update UI Stats
            document.getElementById('count-todo').innerText = `(${stats.cols.todo})`;
            document.getElementById('count-progress').innerText = `(${stats.cols.progress})`;
            document.getElementById('count-done').innerText = `(${stats.cols.done})`;

            const totalTasks = tasks.length;
            const completedTotal = stats.cols.done;
            const pct = totalTasks === 0 ? 0 : Math.round((completedTotal / totalTasks) * 100);
            
            document.getElementById('stat-total').innerText = `${pct}%`;
            ['leader', 'hw', 'ai', 'sw'].forEach(t => {
                document.getElementById(`stat-${t}`).innerText = `${stats.teams[t].d}/${stats.teams[t].t}`;
            });

            localStorage.setItem('pdm_pro_tasks', JSON.stringify(tasks));
        }

        // Drag and Drop Logic
        function setupDragAndDrop() {
            document.querySelectorAll('.kanban-col').forEach(col => {
                col.addEventListener('dragover', e => {
                    e.preventDefault();
                    col.classList.add('drag-over');
                });
                col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
                col.addEventListener('drop', e => {
                    e.preventDefault();
                    col.classList.remove('drag-over');
                    const id = e.dataTransfer.getData('text/plain');
                    const tIndex = tasks.findIndex(t => t.id === id);
                    if (tIndex > -1) {
                        const oldCol = tasks[tIndex].col;
                        const newCol = col.id;
                        if(oldCol !== newCol) {
                            tasks[tIndex].col = newCol;
                            renderBoard(document.getElementById('searchInput').value);
                            
                            // Toast if moved to done
                            if(newCol === 'done') showToast(`تم إنجاز المهمة: ${tasks[tIndex].title} 🎉`, 'success');
                            else showToast(`تم نقل المهمة بنجاح`, 'info');
                        }
                    }
                });
            });
        }

        // Search
        function searchTasks() {
            const query = document.getElementById('searchInput').value.trim();
            renderBoard(query);
        }

        // Modal Logic
        function openTaskDetails(id) {
            const t = tasks.find(x => x.id === id);
            if(!t) return;
            
            document.getElementById('modalTitle').innerText = t.title;
            document.getElementById('modalDesc').innerText = t.desc;
            document.getElementById('modalDate').innerText = t.date;
            
            const badge = document.getElementById('modalTeamBadge');
            badge.innerText = teamsInfo[t.team].name;
            badge.className = `text-xs font-bold px-3 py-1 rounded-full ${teamsInfo[t.team].color}`;
            
            const pBadge = document.getElementById('modalPriority');
            pBadge.innerText = priorityConfig[t.priority].text;
            pBadge.className = `px-3 py-1 rounded-md text-xs font-bold ${priorityConfig[t.priority].style}`;

            document.getElementById('deleteTaskBtn').onclick = () => {
                if(confirm("متأكد من حذف المهمة نهائياً؟")) {
                    tasks = tasks.filter(x => x.id !== id);
                    closeModal('taskModal');
                    renderBoard();
                    showToast("تم حذف المهمة", "error");
                }
            };

            document.getElementById('taskModal').classList.remove('hidden');
        }

        function openAddTaskModal() {
            document.getElementById('newTaskTitle').value = '';
            document.getElementById('newTaskDesc').value = '';
            document.getElementById('addTaskModal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function addNewTask() {
            const title = document.getElementById('newTaskTitle').value.trim();
            const desc = document.getElementById('newTaskDesc').value.trim();
            if(!title) return alert("يرجى كتابة عنوان المهمة");

            const newTask = {
                id: 't' + Date.now(),
                title: title,
                desc: desc || "لا يوجد تفاصيل إضافية.",
                team: document.getElementById('newTaskTeam').value,
                priority: document.getElementById('newTaskPriority').value,
                col: 'todo',
                date: "مهمة جديدة"
            };

            tasks.unshift(newTask); // Add to beginning
            closeModal('addTaskModal');
            renderBoard(document.getElementById('searchInput').value);
            showToast("تمت إضافة المهمة بنجاح!", "success");
        }

        // Toast Notification System
        function showToast(msg, type='info') {
            const tc = document.getElementById('toastContainer');
            const t = document.createElement('div');
            
            let color = 'bg-blue-600';
            let icon = 'fa-info-circle';
            if(type==='success') { color = 'bg-green-600'; icon = 'fa-check-circle'; }
            if(type==='error') { color = 'bg-red-600'; icon = 'fa-exclamation-circle'; }

            t.className = `toast ${color} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold min-w-[250px]`;
            t.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${msg}</span>`;
            
            tc.appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(()=> t.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
